<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Guidelines & Project Details</title>


  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --todo-color: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container { max-width: 850px; width: 100%; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .back-hub-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .back-hub-btn:hover { color: var(--text); border-color: var(--text-muted); }

    .doc-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1.doc-title {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle-track {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    h2 { font-size: 1.3rem; color: #cbd5e1; margin-top: 2rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    h3 { font-size: 1.1rem; color: #93c5fd; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    
    p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1rem; }
    
    ul { margin-bottom: 1.5rem; padding-left: 1.5rem; color: var(--text-muted); }
    li { margin-bottom: 0.5rem; line-height: 1.5; font-size: 0.95rem; }
    li a { color: #60a5fa; text-decoration: none; }
    li a:hover { text-decoration: underline; }

    .todo-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--todo-color);
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      color: #fcd34d;
      font-size: 0.9rem;
      margin: 1rem 0;
      line-height: 1.5;
    }

    .callout {
      background: var(--primary-glow);
      border-left: 4px solid var(--primary);
      padding: 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }
    .callout-title { font-weight: 700; color: #93c5fd; margin-bottom: 0.4rem; font-size: 0.95rem; }
    .callout p { margin-bottom: 0; color: #e2e8f0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div>
        <span style="font-size: 0.8rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">Official Project Guideline</span>
      </div>
      <div class="track-selector"></div>
      <a id="back-link" href="index.html" class="back-hub-btn">← Back to Hub</a>
    </div>

    <div class="doc-content" id="document-body">
      <!-- Rendered dynamically -->
    </div>
  </div>

  <script src="references.js"></script>
  <script src="resources.js"></script>
  <script src="script.js"></script>

  <script>
    // Automatically checks 'hw2.html' against resources.js!
    protectCurrentPage(); 
  </script>


  <script>
    const DOCUMENTS_DATA = {
      "Info Project": {
        title: "Guideline: Project Details",
        commonContent: `
          <p>This project is a crucial component of your academic journey, providing you with the opportunity to apply theoretical knowledge to your own research project. This section outlines the expectations and requirements for your work.</p>

          <h2>Helpful Resources</h2>
          
          <h3>Methodology</h3>
          <ul id="dynamic-methodology-list">
            <!-- Dynamically injected via script -->
          </ul>

          <h3>Survey Platforms</h3>
          <p>If you are planning to use a "simple" survey for data collection, you can use general survey platforms (Google Forms, Microsoft Forms, etc.). If you are implementing an online survey experiment requiring randomization or treatments, consider:</p>
          <ul>
            <li><strong>SoSci Survey:</strong> Offers a free version for academic non-profit, non-published papers</li>
            <li><strong>LimeSurvey, oTree, Gorilla, formr, PsyToolkit</strong></li>
          </ul>
          <p>Make sure your chosen platform supports features like completion time tracking, single-page completion rates, and randomized treatment assignment, depending on what you need for your specific project.</p>

          <h3>Data Analysis Tools</h3>
          <p>For your data analysis and presentation, you may need programming or statistical tools. Useful university resources include:</p>
          <ul>
            <li><a href="https://www.rz.uni-wuerzburg.de/dienste/kurse/" target="_blank">Kurse – Rechenzentrum</a>: Practical training sessions ranging from basic Office software to advanced network administration.</li>
            <li><a href="https://herdt-campus.com/" target="_blank">Herdt-Campus</a>: Digital library providing educational manuals and e-books.</li>
            <li><a href="https://openwuecampus.uni-wuerzburg.de/moodle/enrol/index.php?id=19" target="_blank">R | OpenWueCampus</a>: Introductory e-learning module for R programming.</li>
            <li><a href="https://openwuecampus.uni-wuerzburg.de/moodle/enrol/index.php?id=22" target="_blank">R2 | OpenWueCampus</a>: Follow-up course for advanced data manipulation and visualization.</li>
            <li><a href="https://openwuecampus.uni-wuerzburg.de/moodle/enrol/index.php?id=5" target="_blank">SPSS Teil 1 & Part 2</a>: Beginner and intermediate IBM SPSS online courses.</li>
          </ul>
        `,
        trackContent: {
          "BT": `
            <h2>Bachelor Thesis Project</h2>
            <p>Your thesis project in probably the first project in which you have the possibility to implement the full research process: read relevant literature, formulate a focused research question, develop and implement an experimental design, collect data, analyze the results, and write a thesis presenting your findings.</p>
            <p>For your thesis project you should remember to be </p>
            <div class="todo-box">Include requirements for the Bachelor Thesis project here: read literature, find a research question, implement a design, collect data, analyze, and write a paper presenting findings.</div>

            <h3 id="bt_proj_draft">First Project Draft</h3>
            <p>
                Your first project draft is your tool to pitch your idea to us so that we can understand what you want to work on and match you with the most suitable supervisor. As with any other draft in the thesis writing process at our chair, we ask you to be as precise as possible so we can provide you with meaningful suggestions and feedback. It should include a clear outline of the problem statement, objectives, methodology, and expected outcomes. To submit your proposal, please use the draft template available at <div class="todo-box"><a href="#" class="custom-link">this link</a> </div>. Submission happens via WueCampus. After your submission you might be invited for a meeting to discuss more in detail your idea. 
            </p>

            <div class="todo-box">
                <h4>Project Draft Structure & Expectations</h4>
                <ul>
                    <li><strong>Working Title & Research Question:</strong> State your proposed title and formulate a precise, focused core question you intend to answer.</li>
                    <li><strong>Motivation & Context:</strong> Briefly explain the practical or theoretical relevance of the topic—why does this question matter?</li>
                    <li><strong>Core Literature:</strong> List the 2–3 key academic papers that form the baseline of your research and outline how your work builds on them.</li>
                    <li><strong>Proposed Methodology & Data:</strong> Describe the theoretical framework, empirical strategy, or data source you plan to use to address your question.</li>
                    <li><strong>Expected Outcome & Roadmap:</strong> Outline your initial hypotheses, main expected takeaways, and a brief projected timeline for your project.</li>
                </ul>
            </div>

            <h3 id="bt_ext_proj">Second Project Draft</h3>
            <p>
                Your second project draft serves to show us that what started as a rough idea is now coming to life. At this stage, we want to see significant progress and a much higher level of detail regarding your research setup, including specific treatment conditions, operationalized variables, and empirical design choices. As with all work submitted to our chair, being as precise as possible allows us to give you targeted, high-value feedback ahead of your full write-up. To complete your extended project proposal, please use the draft template available at <div class="todo-box"<a href="#" class="custom-link">this link</a> </div>. Submission happens via WueCampus.
            </p>

            <div class="todo-box">
                <h4>Extended Project Draft Structure & Expectations</h4>
                <ul>
                    <li><strong>Refined Title & Core Hypotheses:</strong> State your updated research question alongside explicit, testable hypotheses.</li>
                    <li><strong>Detailed Experimental Design / Identification Strategy:</strong> Detail your specific treatment arms, control groups, randomization scheme, or econometric identification strategy.</li>
                    <li><strong>Operationalization & Data Setup:</strong> Specify exact primary/secondary datasets, sample sizes, variable definitions, and data collection procedures.</li>
                    <li><strong>Preliminary Results or Analysis Pipeline:</strong> Present any initial exploratory analysis, pilot data, pre-analysis plans, or detailed specifications of your main regression models.</li>
                    <li><strong>Critical Assessment & Identified Risks:</strong> Highlight potential practical challenges, power limitations, or potential threats to identification, along with your planned solutions.</li>
                </ul>
            </div>

            <h3 id="bt_survey1">Design Proposal and/or Survey</h3>
            <p>At this point, you are expected to have a working prototype of your survey/experiment ready for testing. Even though it is called a draft, your survey should be complete. The idea is that you will present your design in your first presentation to receive our feedback as well as peer feedbacks. Your esperimental deisgn and/or your survey should be so ready and complet that if we told you that is okay, you could start collenting data the same day.</p>
            
            <div class="callout">
              <div class="callout-title">💡 Serious Testing Hint</div>
              <p>The quality of your survey/experiment directly impacts the validity and reliability of your findings. Once data collection starts, it is too late to change your design. Ensure thorough testing beforehand!</p>
            </div>
          `,
          "MS": `
            <h2>Master Seminar Project</h2>
            <div class="todo-box">Include requirements for the Master Seminar project here: literature review, research question formulation, experimental design or replication execution, data collection, and analysis.</div>

            <h3 id="ms_proj_draft">First Project Draft</h3>
            <div class="todo-box">Include specific requirements for the first project draft and specific templates.</div>

            <h3 id="ms_ext_proj">Extended Project Draft</h3>
            <div class="todo-box">Include specific requirements for the extended project draft and specific templates. For both relicationa dn own contribution otpion. SHould show familiarity with data (replication) and be the same as BT etended project draft in case od a own controbution </div>
            
            <h3 id="ms_survey1">Design proposal</h3>
            <div class="todo-box">Include specific requirements for how specific the design proposal should be. survey, data collection plan, treatments, sample size etc. This is right now listes only as a deadline for own contribution and not for replication</div>            
          `,
          "BS": `
            <h2>Bachelor Seminar Project</h2>
            <p>Build a clear argument linking a policy problem, behavioral mechanism, and policy proposal:
              <ul>
              <li>Choose a topic and baseline paper following the course’s topic selection procedure. Explain the policy or management problem and why it matters.</li>
              <li>Summarize the paper: research question, setting, method, and main findings.</li>
              <li>Explain the behavioral mechanisms: how might they explain the findings? Distinguish evidence from interpretation.</li>
              <li>When examining the assigned paper, you can propose an additional or alternative mechanism that the paper does not adequately consider or test. Support your explanation with relevant literature.</li>
              <li>Design a policy proposal to test your chosen mechanism. Specify the intervention, testing strategy, main outcome, and expected result. Could another mechanism explain the same result?</li>
              </ul>
              You may address the original policy question or apply one mechanism to another clearly connected problem that can be explained by the same drivers. 
            </p>

            <h3 id="bs_ext_proj">Project Draft</h3>
            <p>Provide an outline of your work up to now. Use this template to organize your knowledge and ideas, and verify whether you are missing any crucial components.</p>
            <p>Complete the provided tabular template before your individual meeting. Prioritize clear concepts and concise descriptions.
            Your ideas may still be provisional, but make them concrete enough to discuss. Explain briefly your assigned paper, prioritizing the interpretation of the results and the key mechanisms at play. Give a description of your experimental proposal and the mechanism you are testing.
            </p>
          `
        }
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let groupParam = urlParams.get('group');

      if (!groupParam || !['BS', 'BT', 'MS'].includes(groupParam.toUpperCase())) {
        groupParam = localStorage.getItem('student_track') || 'BS';
      } else {
        groupParam = groupParam.toUpperCase();
      }

      document.getElementById('back-link').href = `index.html?group=${groupParam}`;

      const docData = DOCUMENTS_DATA["Info Project"];
      let renderedHTML = `
        <h1 class="doc-title">${docData.title}</h1>
        <div class="subtitle-track">Active Profile: ${groupParam} Track &bull; Project Details</div>
        ${docData.commonContent}
      `;

      if (docData.trackContent && docData.trackContent[groupParam]) {
        renderedHTML += docData.trackContent[groupParam];
      }

      document.getElementById('document-body').innerHTML = renderedHTML;

      // Dynamically populate methodology list from references.js
      const methodologyKeys = ['haaland2023designing', 'stantcheva2023run'];
      const listContainer = document.getElementById('dynamic-methodology-list');
      if (listContainer && typeof BIBLIOGRAPHY !== 'undefined') {
        let listHTML = '';
        methodologyKeys.forEach(key => {
          const ref = BIBLIOGRAPHY[key];
          if (ref) {
            listHTML += `<li><strong>${ref.author} (${ref.year}):</strong> ${ref.title}</li>`;
          }
        });
        listContainer.innerHTML = listHTML;
      }
    });
  </script>
</body>
</html>
