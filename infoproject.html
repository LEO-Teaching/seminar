      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;

      color: var(--text);

      color: #60a5fa;
      text-decoration: underline;
    }

      color: #60a5fa;
      text-decoration: underline;

      padding: 1rem;
      border-radius: 0 8px 8px 0;
      color: #fcd34d;
      font-size: 0.9rem;
      margin: 1rem 0;
      line-height: 1.5;

      padding: 1.25rem;
      border-radius: 0 8px 8px 0;

      margin-bottom: 0.5rem;
      transition: border-color 0.2s;

      display: flex;
      align-items: center;

                    <p>Your seminar paper gives you experience with the full research process: engaging with literature, formulating a

                    <p><strong>Start from the literature:</strong> Identify a phenomenon that interests you and explore the relevant
                        research. Prioritize a small set of well-understood papers over a long reading list. Include experimental and empirical
                        applications alongside theoretical work: they can help you identify useful methods and feasible designs. You
                        are responsible for understanding the sources you cite.</p>

                    <p><strong>Keep your question focused and your design manageable:</strong> Aim to answer one precise question
                        within the available time and resources. Each treatment and measurement should serve that question. A
                        simple, carefully implemented project is stronger than a complex design that you cannot execute or interpret
                        convincingly. Your contribution may be a modest extension or adaptation of existing research, provided you
                        explain what it adds. . For the seminar paper, a clean and well-constructed design is more important than a large sample.</p>

                    <p><strong>Collect your own data:</strong> Your project must include primary data generated through a survey or
                        experiment that you implement with participants. Existing datasets may complement this evidence but cannot
                        be its only source. Plan recruitment and a realistic sample size with the supervision team. Seek a reasonably large set observations to get a first idea of the main results of your experiment, and acknowledge when your sample limits the conclusions you can draw.</p>

                    <p><strong>Analyze and interpret your evidence carefully:</strong> Document how you clean and organize the data,
                        use appropriate descriptive statistics, visualizations, and statistical methods, and connect the results to
                        your research question. Distinguish what the evidence supports from what remains uncertain. Unexpected or
                        statistically insignificant findings are valid outcomes: the aim is a sound research process and an honest
                        interpretation.</p>

                    <h3 id="ms_proj_draft">First Project Draft</h3>
                    <p>
                        Your first project draft is your tool to pitch your idea to us so that we can understand what you want to
                        work on and match you with the most suitable supervisor. As with any other draft in the seminar paper writing
                        process at our chair, we ask you to be as precise as possible so we can provide you with meaningful
                        suggestions and feedback. It should include a clear outline of the problem statement, objectives,
                        methodology, and expected outcomes. To submit your proposal, please use the draft template available at <a
                            href="https://view.officeapps.live.com/op/view.aspx?src=https%3A%2F%2Fraw.githubusercontent.com%2FLEO-Teaching%2Fseminar%2Frefs%2Fheads%2Fmain%2FProject_Drafts%2FProject_Draft_Experiment.docx&wdOrigin=BROWSELINK"
                            style="color: #2b6cb0;" target="_blank">this link</a>. Submission happens via WueCampus. After your
                        submission you might be invited for a meeting to discuss more in detail your idea.
                    </p>

                    <h4>Project Draft Structure</h4>

                    <details>
                        <summary>Name:</summary>
                        <div> Your name</div>
                    </details>
                    <details>
                        <summary>Overall topic:</summary>
                        <div> Briefly explain the topic you are interested in, together with its practical or theoretical relevance.
                            Why
                            does this topic matter? Why are you interested in it?</div>
                    </details>
                    <details>
                        <summary>
                            Concrete research question:</summary>
                        <div> What exactly do you want to study within this topic?

                            <!-- Example 1: Broad vs Narrow -->
                            <p><strong>Avoid a question that is too broad:</strong></p>
                            <blockquote>
                                <em>"What makes people happy?"</em>
                            </blockquote>
                            <p>
                                ❌ <strong>Why it doesn't work:</strong> This question is far too wide in scope. "People" covers the
                                entire human population, and "happiness" can be measured in dozens of ways (psychological, economic,
                                biological, sociological). It cannot be adequately addressed within the limits of a thesis.
                            </p>

                            <p><strong>Choose a question that is feasible and narrow:</strong></p>
                            <blockquote>
                                <em>"How does the duration of daily remote work affect self-reported job satisfaction among
                                    full-time
                                    office workers in Germany?"</em>
                            </blockquote>
                            <p>
                                ✅ <strong>Why it works:</strong> It specifies a target population (full-time office workers in
                                Germany),
                                a clear variable/cause (duration of daily remote work), and a measurable outcome (self-reported job
                                satisfaction).
                            </p>

                            <hr>

                            <!-- Example 2: Yes/No Question -->
                            <p><strong>Avoid Yes/No Questions:</strong></p>
                            <blockquote>
                                <em>"Is remote work beneficial for employees?"</em>
                            </blockquote>
                            <p>
                                ❌ <strong>Why it doesn't work:</strong> "Beneficial" is a yes/no judgment call.
                            </p>

                            <p><strong>A better question would be:</strong></p>
                            <blockquote>
                                <em>"How does remote work influence employee productivity and work-life balance?"</em>
                            </blockquote>
                            <p>
                                ✅ <strong>Why it works:</strong> It focuses on how specific outcomes (productivity, work-life
                                balance)
                                are affected rather than just asking if remote work is "good" or "bad."
                            </p>
                        </div>
                    </details>
                    <details>
                        <summary>Short description of project:</summary>
                        <div> Briefly explain how you would like to answer the research question, which are you expectations and
                            hypotheses etc.</div>
                    </details>
                    <details>
                        <summary>Research Method:</summary>
                        <div> These are some of the available research methods that you could use in your project:
                            <ul>
                                <li>
                                    <strong>1. Online Behavioral Game / Experiment:</strong>
                                    <p>A web-based game or decision task (e.g., using oTree or Qualtrics) where participants are
                                        randomly assigned to a control group or a treatment group with different rules, payoffs, or
                                        information setups to observe strategic behavior.</p>
                                    <p><em>Example Research Question:</em> "How does the introduction of a chat option affect
                                        contribution levels in a Public Goods Game?"</p>
                                </li>

                                <li>
                                    <strong>2. Survey Experiment / Vignette Study:</strong>
                                    <p>A randomized scenario embedded inside an online questionnaire, where different groups of
                                        participants receive slightly altered descriptions or framing of a situation to test how
                                        information affects decisions or opinions.</p>
                                    <p><em>Example Research Question:</em> "How does framing a carbon offset policy as a 'fee'
                                        versus a
                                        'tax' affect willingness to pay?"</p>
                                </li>

                                <li>
                                    <strong>3. Small Audit / Correspondence Study:</strong>
                                    <p>A field method where matched pairs of inquiries, emails, or applications (e.g., to landlords
                                        or
                                        employers) are sent out with identical details except for one single randomized
                                        characteristic
                                        to test for discrimination or response bias.</p>
                                    <p><em>Example Research Question:</em> "To what extent do foreign-sounding names affect callback
                                        rates for entry-level rental apartments?"</p>
                                </li>

                                <li>
                                    <strong>4. Standard Survey:</strong>
                                    <p>Gathering self-reported data on economic behaviors, financial choices, or individual
                                        preferences
                                        using an online questionnaire. </p>
                                    <p><em>Example Research Question:</em> "How does financial literacy influence personal savings
                                        behavior among young adults?"</p>
                                    <p><em>Note:</em> For this kind of research method there is no exogenous variation (treatment),
                                        so
                                        no causal analysis can be done.</p>
                                </li>
                            </ul>
                        </div>
                    </details>
                    <details>
                        <summary>Key References:</summary>
                        <div>
                            <p>List up to 3 core academic papers that relate to your project. Avoid broad overview books and focus
                                on
                                specific journal articles instead. Your references could include any of the following types:</p>
                            <ul>
                                <li>
                                    <strong>A similar research question:</strong> Papers studying a very similar outcome or
                                    relationship, even if tested in a different context, country, or market.
                                </li>
                                <li>
                                    <strong>A similar method or setup:</strong> Papers using the same research design you plan to
                                    use,
                                    such as a specific game setup, survey structure, or audit study.
                                </li>
                                <li>
                                    <strong>The core economic or behavioral mechanism:</strong> Papers that explain or test the
                                    underlying theoretical effect you are focusing on (e.g., framing effects, loss aversion, default
                                    bias).
                                </li>
                                <li>
                                    <strong>Relevant background or context:</strong> Papers providing key empirical facts, policy
                                    context, or benchmark findings related to your specific topic.
                                </li>
                            </ul>
                        </div>
                    </details>
                    <details>
                        <summary>
                            Your questions for our next meeting:</summary>
                        <div>
                            <p>Briefly list any specific points you want to discuss during our meeting. <em>Please review the shared
                                    online resources beforehand—many common questions are already answered there, and checking them
                                    first ensures we can focus our meeting time on what you actually need.</em></p>

                            <p><strong>✅ What to ask / discuss:</strong></p>
                            <ul>
                                <li>Doubts or uncertainties about your research direction or feasibility</li>
                                <li>Potential design problems, practical bottlenecks, or limitations you foresee</li>
                                <li>Technical or software questions (e.g., setting up your survey or online experiment)</li>
                                <li>Decisions where you are choosing between two options and want feedback</li>
                                <li>Anything specific you are stuck on or worried about</li>
                            </ul>

                            <p><strong>❌ What NOT to ask:</strong></p>
                            <ul>
                                <li><strong>"What literature should I use?"</strong> — Finding your key literature is part of your
                                    project.</li>
                                <li><strong>"How many hypotheses do I need?"</strong> — There is no magic number. Your hypotheses
                                    flow
                                    directly from your research question.</li>
                                <li><strong>Questions already answered in the shared online docs</strong> — Please check those
                                    first!
                                    Spending meeting time on questions covered in the docs leaves no time to discuss the important,
                                    custom details of your specific project.</li>
                            </ul>
                        </div>
                    </details>

                            target="_blank">this link</a>. Submission happens via WueCampus.
                        
                      </p>

                      <h4>Extended Project Draft Structure</h4>
                      <details>
                          <summary>Name:</summary>
                          <div>Enter your name.</div>
                      </details>

                      <details>
                          <summary>Overall topic:</summary>

                      </details>

                      <details>
                          <summary>Concrete Research Question:</summary>
                          <div>Formulate one focused question ending with a question mark. Make clear what relationship or effect you intend to investigate and ensure your proposed design can address it.</div>
                      </details>

                      <details>
                          <summary>Short description of project:</summary>
                          <div>In no more than 200 words, summarize your question, motivation, proposed approach, and intended contribution. This should give the reader a clear overview of the project.</div>
                      </details>

                      <details>
                          <summary>Short Literature review and Motivation:</summary>
                          <div>Explain what closely related research has established and how your project builds on it. Identify the specific issue you will investigate and why it matters. Connect the studies to your project rather than listing separate summaries.</div>
                      </details>

                      <details>
                          <summary>Key references:</summary>
                          <div>Include up to five closely related papers, covering relevant empirical evidence, theoretical foundations, and methods. For each reference, briefly explain its specific relevance to your project.</div>
                      </details>

                      <details>
                          <summary>Theoretical Model and mechanisms:</summary>
                          <div>Explain the behavioral or economic process behind your predictions. Describe how it should operate in your setting and connect it to the literature. Naming a bias alone is insufficient; a formal mathematical model is only needed if relevant to your approach.</div>
                      </details>

                      <details>
                          <summary>Hypotheses:</summary>
                          <div>State explicit, testable predictions derived from your mechanisms. Identify the outcome and the expected direction of the relationship or difference between conditions. Keep each hypothesis focused and explain its reasoning.</div>
                      </details>

                      <details>
                          <summary>Treatment (if present):</summary>
                          <div>Describe what participants experience in each treatment and comparison condition, what changes, and what remains constant. Explain why the manipulation should affect your proposed mechanism. Consider alternative mechanisms that could also explain an effect and whether your design can distinguish them. If your study has no treatment, state this explicitly.</div>
                      </details>

                      <details>
                          <summary>Primary measurement variables:</summary>
                          <div>Identify your primary outcome, distinguish it from secondary outcomes and other key variables, and specify how and when each is measured. Provide concrete questions, response scales, or behavioral tasks where possible. Explain how these measures allow you to evaluate your hypotheses.</div>
                      </details>

                      <details>
                          <summary>Intended implementation procedure:</summary>
                          <div>Describe the setting or platform, target population, recruitment, and sequence of participant activities. Specify random assignment where applicable, your expected sample size and its rationale, and practical constraints. Briefly indicate how you plan to analyze the data to assess your hypotheses.</div>
                      </details>

                      <details>
                          <summary>Your questions for our next meeting:</summary>
                          <div>Identify unresolved decisions, practical difficulties, or threats to validity. Explain the options or solutions you are considering and where you need feedback.</div>
                      </details>

                      <p><em>At this stage, we expect a detailed plan; completed results and a fully programmed experiment are not required. Clearly distinguish settled decisions from provisional choices. The complete working prototype is due at the subsequent design proposal stage.</em></p>

                        it affects the interpretation of the baseline results. New data collection is not required.</p>

                        valuable than several loosely connected analyses. Demonstrate that you understand your methodological
                        choices, can work independently with the data, and can distinguish what your evidence supports from what
                        remains uncertain.</p>
