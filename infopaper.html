<!DOCTYPE html>
<html lang="en">


<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="https://leo-teaching.github.io/seminar/mortarboard.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Guidelines & Documentation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #c2d0e5;
      --border: #334155;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --todo-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    /* Navigation & Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .back-hub-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .back-hub-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    /* Content Styling mimicking LaTeX cleanly */
    .doc-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1.doc-title {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle-track {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    h2 {
      font-size: 1.3rem;
      color: #cbd5e1;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }

    h3 {
      font-size: 1.1rem;
      color: #93c5fd;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    strong {
      color: var(--text-muted);
    }

    ul {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: var(--text-muted);
    }

    li {
      margin-bottom: 0.5rem;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    li a {
      color: #60a5fa;
      text-decoration: none;
    }

    a {
      color: #60a5fa !important; /* Use as a last resort */
      text-decoration: none;
    }

    a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    li a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    /* Todo Box placeholders mapping to LaTeX todoColor */
    .todo-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--todo-color);
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      color: #fcd34d;
      font-size: 0.9rem;
      margin: 1rem 0;
      line-height: 1.5;
    }

    /* Hint / Paragraph callouts */
    .callout {
      background: var(--primary-glow);
      border-left: 4px solid var(--primary);
      padding: 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }

    .callout-title {
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .callout p {
      margin-bottom: 0;
      color: #e2e8f0;
    }

        details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 2pt;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }

    details:hover {
      border-color: #60a5fa;
      /* highlights the border slightly on hover */
    }

    summary {
      cursor: pointer;
      padding: 0.25rem 0.25rem;
      font-weight: 600;
      user-select: none;
      display: flex;
      align-items: center;
      /* removes default browser arrow if you want it cleaner */
    }

    summary::before {
      content: "▼";
      font-size: 0.75rem;
      color: #93c5fd;
      transition: transform 0.2s ease;
      margin-right: 0.5rem;
    }

    details[open] > summary::before{
      transform: rotate(180deg); /* Turns the triangle downward when open */
    }

    details>div {
      margin-left: 1.5rem;
      margin-top: 0.5rem;
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }


    .collapse-section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 1rem;
        padding: 0.5rem
}

    .collapse-header {
    cursor: pointer;
    padding: 0.5rem;
    user-select: none;
    }

    /* Optional: removes margins from h3 inside summary so it aligns nicely */
    .collapse-header h4 {
    margin: 0;
    display: inline; 
    }
    .collapse-header h3 {
    margin: 0;
    display: inline; 
    }

    .collapse-content {
    padding: 0 0rem 0rem 0rem;
    }
  </style>
</head>

            <p>Your Bachelor Thesis should demonstrate your ability to conduct independent research and present your findings in a structured and coherent manner. </p>

            <h3 id="bs_submission">Paper Structure and Core Elements</h3>  
            
            <p>Your paper should develop a clear argument connecting a policy or management problem, existing evidence, behavioural mechanisms, and a proposed experimental intervention.</p>

            <p><strong style="color:white" >Your paper should be a maximum of 15 pages long, including the title page, table of contents, main text, tables, figures, references, and appendices.</strong> Only AI-related declarations and the <a class="custom-link" style="color: #2b6cb0;" href="https://www.uni-wuerzburg.de/fileadmin/33120300/Pruefungsamt/Formulare/Allgemeine_Formulare/Versicherung_zur_Leistungserbringung/20231127_Versicherung_zur_selbststaendigen_Leistungserbringung.pdf">Versicherung zur selbstständigen Leistungserbringung</a> are excluded from this count.</p>

            <p>The following structure represents a suggested guide, rather than a fixed chapter outline. You may combine, reorganize or rename sections, provided all core elements are addressed.</p>

                <h4>1. Introduction (Approx. 1-2 Pages)</h4>
                <ul>
                    <li><strong>Motivation & relevance:</strong> Introduce the policy or management problem and explain why it matters.</li>
                    <li><strong>Guiding Question:</strong> State the question guiding your seminar paper..</li>
                    <li><strong>Contribution:</strong> Briefly explain how your discussion builds on the baseline paper and introduce your proposed contribution.</li>
                    <li><strong>Paper Structure:</strong> Provide a roadmap of the subsequent sections.</li>
                </ul>

                <h4>2. Baseline Paper and Related Literature (Approx. 2-3 Pages)</h4>
                <ul>
                    <li><strong>Study Overview:</strong> Explain the baseline paper’s research question, setting, method, and main findings.</li>
                    <li><strong>Supporting Evidence:</strong> Describe the key comparisons or evidence supporting its conclusions.</li>
                    <li><strong>Critical Assessment:</strong> Discuss its strengths and relevant limitations.</li>
                    <li><strong>Related Literature:</strong> Connect it to a small selection of closely related studies that help explain the findings or motivate your proposal.</li>
                </ul>

                <h4>3. Mechanisms and Alternative Explanations (Approx. 2-3 Pages)</h4>
                <ul>
                    <li><strong>Baseline Mechanisms:</strong> Explain the theoretical or behavioural mechanisms proposed in the baseline paper and how they operate in its setting.</li>
                    <li><strong>Alternative Mechanisms:</strong> Develop at least one alternative or additional mechanism that the paper does not adequately consider or test. Support your reasoning with relevant literature.</li>
                    <li><strong>Distinguishing Predictions: </strong> Discuss whether these explanations predict similar behaviour and what evidence could help distinguish them.</li>
                </ul>

                <h4>4. Proposed Experimental Intervention (Approx. 4-5 Pages)</h4>
                <ul>
                    <li><strong>Research Question & Mechanism: </strong> State the specific research question and mechanism your experiment would investigate. Precise whether you are investigating the original policy problem or applying the mechanism to a different, clearly connected setting.</li>
                    <li><strong>Experimental Design:</strong> Describe the target population, treatment and comparison conditions, random assignment, and basic procedure.</li>
                    <li><strong>Outcomes & Hypotheses:</strong> Specify the primary outcome, how it would be measured, and your hypotheses.</li>
                    <li><strong>Mechanism Test & Limitations: </strong> Explain how the experimental comparison would test your mechanism, whether alternative explanations remain, and the main limitations or practical challenges.</li>
                </ul>

                <h4>5. Discussion and Conclusion (Approx. 1-2 Pages)</h4>
                <ul>
                    <li><strong>Synthesis:</strong> Bring together the baseline evidence, your mechanism discussion, and the contribution of your proposed experiment.</li>
                    <li><strong>Practical Implications: </strong> Explain what could be learned from the experiment and discuss relevant policy or management implications.</li>
                    <li><strong>Concluding Answer:</strong> End with a concise answer to the question guiding your seminar paper, acknowledging the limits of the available evidence.</li>
                </ul>
                <h4>References</h4>
                <h4>Appendix</h4>
          `
        }
      }
