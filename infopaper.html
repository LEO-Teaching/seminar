<!DOCTYPE html>
<html lang="en">


<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="https://leo-teaching.github.io/seminar/mortarboard.png" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Guidelines & Documentation</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #c2d0e5;
      --border: #334155;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --todo-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 850px;
      width: 100%;
    }

    /* Navigation & Header Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .back-hub-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .back-hub-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    /* Content Styling mimicking LaTeX cleanly */
    .doc-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1.doc-title {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle-track {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    h2 {
      font-size: 1.3rem;
      color: #cbd5e1;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }

    h3 {
      font-size: 1.1rem;
      color: #93c5fd;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    strong {
      color: var(--text-muted);
    }

    ul {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: var(--text-muted);
    }

    li {
      margin-bottom: 0.5rem;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    li a {
      color: #60a5fa;
      text-decoration: none;
    }

    li a:hover {
      text-decoration: underline;
    }

    /* Todo Box placeholders mapping to LaTeX todoColor */
    .todo-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--todo-color);
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      color: #fcd34d;
      font-size: 0.9rem;
      margin: 1rem 0;
      line-height: 1.5;
    }

    /* Hint / Paragraph callouts */
    .callout {
      background: var(--primary-glow);
      border-left: 4px solid var(--primary);
      padding: 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }

    .callout-title {
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .callout p {
      margin-bottom: 0;
      color: #e2e8f0;
    }
  </style>
</head>

<body>

      <div class="track-selector"></div>

    <div class="doc-content" id="document-body">

    </div>
  </div>

          <p>Independent of your specific track, your paper should allow for a clear and concise presentation of your research. For this reason its main objective is to transmit your message in a clear way, both in terms of formalities and acedemic correctness and in terms of content.</p>
          <p> This document is not designed to explain you the formalities and rules of academic writing, for that kind of information, please consult the <a href="https://leo-teaching.github.io/seminar/standards.html">Formatting Standards</a> document.</p>
            
          <p>We also remind you that other information is available on WueCampus in the form of slides from our Intro Meeting on Reading and Writing. </p>

          <h2>Literature</h2>
          <p>
            Choose sources critically
            <ul>
          <li>Journals: Leading economics journals and established field journals are useful starting points. </li>
          <li>Authors: Look for expertise and related publications. Reputation alone does not guarantee a convincing paper.</li>
          <li>Citations: Consider publication year and field. Recent papers have had less time to accumulate citations; highly cited papers are influential, not necessarily correct.</li>
          <li>Evidence: Always assess the paper’s methods, conclusions, and limitations yourself. Check whether a working paper has a newer or published version.</li>
          </ul>
          </p>
          <p>Read and organize efficiently
          <ul>
          <li>Start with the abstract, introduction, and conclusion, then, only if the paper aligns with your topic and research question, study the relevant methods, tables, and results. Don't cite studies of which you only read the abtsract.</li>
          <li>Highlight selectively and take notes in your own words: question, method, findings, mechanism, limitations, and relevance to your project. Record page numbers for useful passages, distinguish quotations from your own ideas, and add citations while writing.</li>
          <li>Keep a reference library, for example in Zotero, with PDFs and complete publication details. </li>
          <li>Use reference lists and “cited by” searches to find related work.</li>
          </ul>
           <p>Prioritize a focused set of papers you understand well over a long list of loosely related references. Remember: you are responsible for your citations and you are expected to be proficient in each paper you mention.</p>

            <h2>Bachelor Thesis Guidelines</h2>
            <p>Your Bachelor Thesis should demonstrate your ability to conduct independent research and present your findings in a structured and coherent manner. </p>
            
            <h3 id="bt_ext_paper_coll_data"> Paper Draft</h3>
            <p>Submit a preliminary version of your final thesis, following its intended structure and including all work completed so far: motivation, relevant literature, research question, hypotheses, experimental design, data collection, and empirical strategy.

            <div class="callout">
            <div class="callout-title">💡 Hint on Strategy</div>
            <p>A paper draft should never be treated as a simple deadline to fulfill just to make your supervisor happy. Instead, look at it as a strategic opportunity to receive critical feedback on your research approach and structure. The more complete and polished your draft is, the more actionable the feedback will be. Maintain a single master document from day one that mirrors the final structure of your paper and share that "work-in-progress" docuemnt when asked for a Paper Draft.</p>
          </div>
            
            <h3 id="bt_submission">Final Paper</h3>
            <p>Your paper should be a maximum of 25 pages long, including the title page, abstract, table of contents, main text, tables, figures, references, and appendices. Only AI-related declarations and the <a class="custom-link" style="color: #2b6cb0;" href="https://www.uni-wuerzburg.de/fileadmin/33120300/Pruefungsamt/Formulare/Allgemeine_Formulare/Versicherung_zur_Leistungserbringung/20231127_Versicherung_zur_selbststaendigen_Leistungserbringung.pdf">Versicherung zur selbstständigen Leistungserbringung</a> are excluded from this count.</p>
            
            <h3 id="bt_submission">Structure</h3>
            <p> The following structure serves only as reference. There is no one-fits-all structure that will work for every topic and type of project, so fill free to use different chapter subdivisions and page numbers.
            <div>
              <h4>Abstract</h4>
              <h4>1. Introduction (Approx. 2-3 Pages)</h4>
              <ul>
                  <li><strong>Motivation & Relevance:</strong> Introduce the economic or real-world problem and explain why the topic is important.</li>
                  <li><strong>Research Question:</strong> Formulate the precise, focused question your thesis aims to answer.</li>
                  <li><strong>Methodological Approach:</strong> Briefly outline how you collect data and analyze the problem.</li>
                  <li><strong>Thesis Structure:</strong> Provide a roadmap of the subsequent chapters.</li>
              </ul>

              <h4>2. Theoretical Background & Literature Review (Approx. 4-5 Pages)</h4>
              <ul>
                  <li><strong>State of Research:</strong> Review the existing academic literature and theories relevant to your topic.</li>
                  <li><strong>Conceptual Framework:</strong> Define key terms and establish the theoretical mechanisms at play.</li>
                  <li><strong>Hypothesis Development:</strong> Formulate clear, testable hypotheses derived from theory and prior empirical work.</li>
              </ul>
              <div class="callout">
              <div class="callout-title"> Hint for candidates writing both a seminar and a thesis paper </div>
              <p >The opening chapters of the thesis must not simply replicate or copy-paste that seminar work. Introductory and literature chapters must contain only information directly useful or interesting for the specific thesis question.</p>
              </div>
              <h4>3. Data & Methodology (Approx. 4-5 Pages)</h4>
              <ul>
                  <li><strong>Data Collection Strategy:</strong> Describe how the data was gathered (e.g., primary survey, experiment, or secondary dataset acquisition).</li>
                  <li><strong>Sample & Descriptive Statistics:</strong> Detail sample size, cleaning procedures, and summary statistics.</li>
                  <li><strong>Empirical Strategy:</strong> Explain your econometric model, estimation techniques, and how variables are operationalized.</li>
              </ul>

              <h4>4. Empirical Results (Approx. 4-5 Pages)</h4>
              <ul>
                  <li><strong>Main Findings:</strong> Present your regression or analytical results using properly numbered and captioned tables and figures.</li>
                  <li><strong>Economic Interpretation:</strong> Explain what the statistical coefficients and tests mean in substantive terms.</li>
                  <li><strong>Robustness Checks:</strong> Test the sensitivity of your findings with alternative specifications or sub-sample analyses.</li>
              </ul>

              <h4>5. Discussion & Limitations (Approx. 2-3 Pages)</h4>
              <ul>
                  <li><strong>Contextualization:</strong> Compare your findings with existing literature and economic theory.</li>
                  <li><strong>Implications:</strong> Discuss practical, managerial, or policy implications of your results.</li>
                  <li><strong>Limitations:</strong> Transparently address methodological constraints, potential biases, and external validity.</li>
              </ul>

              <h4>6. Conclusion (Approx. 1 Page)</h4>
              <ul>
                  <li><strong>Summary of Findings:</strong> Recap the core research question, empirical approach, and main takeaway.</li>
                  <li><strong>Future Research:</strong> Highlight open questions and areas for subsequent investigation.</li>
              </ul>

              <h4>Appendix</h4>
          </div>

    window.addEventListener('DOMContentLoaded', () => {
      const activeTrack = getActiveTrack();
      if (!activeTrack) return; // If no track, script.js handles the modal and halts here

      const backLink = document.getElementById('back-link');
      if (backLink) {
        backLink.href = `index.html?group=${activeTrack}`;
      }

      const docName = "Info Paper";
      const docData = DOCUMENTS_DATA[docName];

      let renderedHTML = `
        <h1 class="doc-title">${docData.title}</h1>

      `;

      if (docBody) {

      }

      if (window.location.hash) {
        setTimeout(() => {

          console.log("2. Target Element Found:", targetElement);

          if (targetElement) {
            console.log("3. Scrolling now...");
            targetElement.scrollIntoView({ behavior: 'smooth' });
          } else {
