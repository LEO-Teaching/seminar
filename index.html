<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="https://leo-teaching.github.io/seminar/mortarboard.png"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hub & Resource Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #485f81;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    #hub-container {
      width: 100%;
      max-width: 1000px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .track-selector {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .track-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .track-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .track-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 2rem 0 1rem 0;
      color: var(--text);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .hub-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
      cursor: pointer;
    }

    .hub-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      display: inline-block;
    }

    .status-badge.unlocked {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.locked {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .hub-card.locked-card {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .hub-card.locked-card:hover {
      transform: none;
      border-color: var(--border);
    }
  </style>
</head>

<body>

  <div id="hub-container">
    <div class="header-bar">
      <div>
        <h2>Resource Hub</h2>
        <span style="color: var(--text-muted); font-size: 0.9rem;">Select your active academic track</span>
      </div>
      <div class="track-selector"></div>
    </div>

    <!-- Core Navigation Links -->

    <div class="grid-container">
      <a id="roadmap-link" href="roadmap.html" class="hub-card">
        <div>
          <div class="card-header">
            <div class="card-title">🗺️ Roadmap</div>
          </div>
          <div class="card-desc">View your milestone timeline and upcoming target dates.</div>
        </div>
      </a>
    </div>


    <!-- Course Documents & Resources Section -->
    <div class="section-title">Course Documents & Resources</div>
    <div id="resources-grid" class="grid-container"></div>
  </div>

  <!-- Centralized data sources -->
  <script src="shared-data.js"></script>
  <script src="references.js"></script>
  <script src="resources.js"></script>
  <script src="script.js"></script>
  <script>
  

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let groupParam = urlParams.get('group');
      let storedTrack = localStorage.getItem('student_track');

      // Check if URL or localStorage has a valid track
      const validTracks = ['BS', 'BT', 'MS'];
      let activeTrack = null;

      if (groupParam && validTracks.includes(groupParam.toUpperCase())) {
        activeTrack = groupParam.toUpperCase();
      } else if (storedTrack && validTracks.includes(storedTrack.toUpperCase())) {
        activeTrack = storedTrack.toUpperCase();
      }

      // NO FALLBACK: If no valid track is found anywhere, open the selection modal
      if (!activeTrack) {
        document.getElementById('global-track-modal').style.display = 'flex';
      } else {
        switchTrack(activeTrack, false);
      }
    });

    // Function triggered when user clicks a track inside the forced modal
    function selectAndCloseModal(track) {
      localStorage.setItem('student_track', track);
      document.getElementById('global-track-modal').style.display = 'none';
      
      // Update URL and reload/switch track
      const newUrl = `${window.location.pathname}?group=${track}`;
      window.location.href = newUrl; 
    }

    function switchTrack(track, updateURL = true) {
      currentTrack = track;
      localStorage.setItem('student_track', currentTrack);

      document.querySelectorAll('.track-btn').forEach(btn => {
        if (btn.getAttribute('data-track') === currentTrack) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      document.getElementById('roadmap-link').href = `roadmap.html?group=${currentTrack}`;

      if (updateURL && window.history.pushState) {
        const newUrl = `${window.location.pathname}?group=${currentTrack}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
      }

      renderHubResources();
    }


    function renderHubResources() {
      const grid = document.getElementById('resources-grid');
      if (!grid) return;

      if (!window.RESOURCES || !Array.isArray(window.RESOURCES)) {
        grid.innerHTML = '<p style="color: var(--text-muted);">No resources available.</p>';
        return;
      }

      let html = '';

      window.RESOURCES.forEach(res => {
        // Check group-specific devOnly status
        const isDevForThisGroup = isDevOnlyForGroup(res.devOnly, currentTrack);

        // Hide if in dev-mode for this group AND user is not in dev mode
        if (isDevForThisGroup && !window.isDev) return;

        // Hide completely if resource is not assigned to the active track
        if (res.tracks && Array.isArray(res.tracks) && !res.tracks.includes(currentTrack)) {
          return;
        }

        // Render locked / unlocked cards...
        const isUnlocked = (typeof window.isResourceUnlocked === 'function')
          ? window.isResourceUnlocked(res.file, currentTrack)
          : true;



        const releaseDateFormatted = (typeof window.getFormattedReleaseDate === 'function')
          ? window.getFormattedReleaseDate(res, currentTrack)
          : null;

        const targetURL = `${res.file}?group=${currentTrack}`;

        if (isUnlocked) {
          html += `
            <a href="${targetURL}" class="hub-card">
              <div>
                <div class="card-header">
                  <div class="card-title"> ${res.title || res.file}</div>
                </div>
                <div class="card-desc">${res.desc}</div>
                <div class="card-desc">${res.footer}</div>
              </div>
            </a>
          `;
        } else {
          html += `
            <div class="hub-card locked-card">
              <div>
                <div class="card-header">
                  <div class="card-title"> ${res.title || res.file} 🔒</div>
                  <span class="status-badge locked">Locked</span>
                </div>
                <div class="card-desc">${res.desc || 'This resource is currently locked'}</div>
                <div class="lock-banner" style="background: #6f639d; color: #d5d4f4; padding: 8px; border-radius: 4px; font-size: 0.85rem; margin-top: 10px;">
                  🔒 Available on <strong>${releaseDateFormatted || 'TBA'}</strong>
                </div>
              </div>
            </div>
          `;
        }
      });

      grid.innerHTML = html;
    }

  </script>
  <script>
    // Global render function called by script.js on page load or track switch
    function renderPage(selectedTrack) {
      document.getElementById('roadmap-link').href = `roadmap.html?group=${selectedTrack}`;
      renderHubResources();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const activeTrack = getActiveTrack();
      renderPage(activeTrack);
    });
  </script>
  <!-- Track Selection Modal (Shown if no track is found) -->
<div id="global-track-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.9); justify-content:center; align-items:center; z-index:99999;">
    <div style="background:var(--card-bg, #1e293b); border:1px solid var(--border, #485f81); padding:30px; border-radius:12px; width:340px; text-align:center; color:var(--text, #f8fafc); font-family:system-ui, sans-serif; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <h3 style="margin-top:0; margin-bottom:10px;">Select Academic Track</h3>
        <p style="color:var(--text-muted, #94a3b8); font-size:0.9rem; margin-bottom:20px;">Please select your track to continue:</p>
        <div style="display:flex; flex-direction:column; gap:12px;">
            <button onclick="selectAndCloseModal('BS')" style="padding:12px; background:var(--accent, #3b82f6); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Bachelor Seminar (BS)</button>
            <button onclick="selectAndCloseModal('BT')" style="padding:12px; background:var(--accent, #3b82f6); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Bachelor Thesis (BT)</button>
            <button onclick="selectAndCloseModal('MS')" style="padding:12px; background:var(--accent, #3b82f6); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Master Seminar (MS)</button>
        </div>
    </div>
</div>
</body>

</html>
