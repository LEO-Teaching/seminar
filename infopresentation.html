<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="https://leo-teaching.github.io/seminar/mortarboard.png"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Guidelines & Presentations</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #c2d0e5;
      --border: #334155;
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --todo-color: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container { max-width: 850px; width: 100%; }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .back-hub-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .back-hub-btn:hover { color: var(--text); border-color: var(--text-muted); }

    hr {
    display: block;
    height: 1px;
    border: 0;
    border-top: 1px solid var(--border);
    margin: 1.5em 0;
    padding: 0;
    }
    .doc-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1.doc-title {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle-track {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    h2 { font-size: 1.3rem; color: #cbd5e1; margin-top: 2rem; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    h3 { font-size: 1.1rem; color: #93c5fd; margin-top: 1.5rem; margin-bottom: 0.5rem; }
    
    p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1rem; }
    
    ul { margin-bottom: 1.5rem; padding-left: 1.5rem; color: var(--text-muted); }
    li { margin-bottom: 0.5rem; line-height: 1.5; font-size: 0.95rem; }

    
    li a {
      color: #60a5fa;
      text-decoration: none;
    }

    a {
      color: #60a5fa !important; /* Use as a last resort */
      text-decoration: none;
    }

    a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    li a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    .todo-box {
      background: rgba(245, 158, 11, 0.1);
      border-left: 4px solid var(--todo-color);
      padding: 1rem;
      border-radius: 0 8px 8px 0;
      color: #fcd34d;
      font-size: 0.9rem;
      margin: 1rem 0;
      line-height: 1.5;
    }

    .callout {
      background: var(--primary-glow);
      border-left: 4px solid var(--primary);
      padding: 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }
    .callout-title { font-weight: 700; color: #93c5fd; margin-bottom: 0.4rem; font-size: 0.95rem; }
    .callout p { margin-bottom: 0; color: #e2e8f0; }


    
    details {
      background: var(--card-bg);
      border: 0.5px solid var(--border);
      border-radius: 2pt;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }

    details:hover {
      border-color: #60a5fa;
      /* highlights the border slightly on hover */
    }

    summary {
      cursor: pointer;
      padding: 0.25rem 0.25rem;
      font-weight: 600;
      user-select: none;
      display: flex;
      align-items: center;
      /* removes default browser arrow if you want it cleaner */
    }

    summary::before {
      content: "▼";
      font-size: 0.75rem;
      color: #93c5fd;
      transition: transform 0.2s ease;
      margin-right: 0.5rem;
    }

    details[open] > summary::before{
      transform: rotate(180deg); /* Turns the triangle downward when open */
    }

    details>div {
      margin-left: 1.5rem;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
    }


    .collapse-section {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 1rem;
        padding: 0.5rem;
}

    .collapse-header {
    cursor: pointer;
    padding: 0.5rem;
    user-select: none;
    }

    /* Optional: removes margins from h3 inside summary so it aligns nicely */
    .collapse-header h4 {
    margin: 0;
    display: inline; 
    border: none;
    }
    .collapse-header h3 {
    margin: 0;
    display: inline; 
    border: none;
    }

    .collapse-content {
    padding: 0 0rem 0rem 0rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <div>
        <span style="font-size: 0.8rem; color: var(--primary); font-weight: 700; text-transform: uppercase;">Presentations Guideline</span>
      </div>
      <div class="track-selector"></div>
      <a id="back-link" href="index.html" class="back-hub-btn">← Back to Hub</a>
    </div>

    <div class="doc-content" id="document-body">
      <!-- Rendered dynamically -->
    </div>
  </div>

  <script src="resources.js"></script>
  <script src="script.js"></script>

  <script>

            <h2>Bachelor Thesis Presentations</h2>
            
            <h3 id="bt_pres1">Midterm presentation</h3>
<h3 id="bt_pres1">Midterm presentation</h3>
<p>Your first presentation (max. 10 minutes) is a checkpoint to get feedback on your study plan before data collection. Structure your talk around three parts:</p>

            <p>Your first presentation (max. 10 minutes) is a checkpoint to get feedback on your study plan before data collection. Structure your talk around three parts:</p>

<p><strong>What to avoid:</strong> Do not give a wide literature overview, and do not walk through every survey item or low-level technical/implementation detail. Every design or implementation point should show how it tests your mechanism. You can use the template for the extended project draft to make sure that your presentation covers the main aspects of a research project. Focus on the points mentioned above.</p>

            <p>Your presentation will be followed by up to 10 minutes of discussion and questions. Active peer participation is required.</p>
            </details>

            <details class="collapse-section">
                    <summary class="collapse-header">
            <h3 id="ms_pres1" >Midterm presentation (replication and extension)</h3></summary>
             
            <p>Your first presentation is an important milestone in your project and allows you to receive valuable feedback and practice your research exposure skills. We expect your presentation (max. 10 minutes) to include:</p>
            <ul>
              <li><strong>Baseline Paper & Replication Progress:</strong>  Research question, main findings, replication scope, and results obtained so far, including discrepancies with the original study (approx. 5-6 minutes).

</li>
              <li><strong>Extension & Next Steps:</strong> Motivation and research question for your extension, planned analysis or preliminary findings, limitations, and remaining challenges (approx. 4-5 minutes).
</li>
            </ul>

            <p>Your presentation will be followed by up to 10 minutes of discussion and questions. Active peer participation is required.</p>

            <p>Your analyses need not be complete, but you should demonstrate concrete progress and a feasible plan.</p>


            <h4>Aspects you need to take care of</h4>
<div>Prepare to explain and discuss:
  <ul>
    <li><strong>Understanding the baseline:</strong> What does the original paper investigate, and how do its methods support its conclusions? </li>
<li><strong>Replication scope:</strong> Which tables, figures, or estimates are you reproducing?</li>
<li><strong>Data preparation:</strong> How have you defined the sample, handled missing values, and constructed the key variables?</li>
<li><strong>Methods:</strong> Do your specifications, weights, and standard errors match the original analysis, where applicable?</li>
<li><strong>Results and discrepancies:</strong> How do your results compare with the published findings? What differences remain, and how will you investigate them?</li>
<li><strong>Extension and contribution:</strong> What additional question are you addressing, and why is it informative?</li>
<li><strong>Planned analysis:</strong> Which variables, comparisons, or models will answer your extension question? Can the available data support it?</li>

          "BS": `
            <h2>Bachelor Seminar Presentation</h2>

            <h3 id="bs_pres">Final presentation</h3>
            <p>Content & structural weights must be strictly observed:</p>
            <ul>
              <li><strong>Introduction & Motivation (approx. 2 min):</strong> Introduce your policy or management question.</li>
              <li><strong>Critical Discussion of Existing Evidence (approx. 3–4 min):</strong> Concise overview of baseline paper and literature.</li>
              <li><strong>Identification of Behavioral Mechanisms (approx. 5–6 min):</strong> Core of your presentation—critically assess underlying behavioral drivers.</li>

    window.addEventListener('DOMContentLoaded', () => {
      const activeTrack = getActiveTrack();
      if (!activeTrack) return; // If no track, script.js handles the modal and halts here

      const backLink = document.getElementById('back-link');
      if (backLink) {
        backLink.href = `index.html?group=${activeTrack}`;
      }

      const docData = DOCUMENTS_DATA["Info Presentation"];
      let renderedHTML = `
        <h1 class="doc-title">${docData.title}</h1>
        <div class="subtitle-track">Active Profile: ${activeTrack} Track </div>
        ${docData.commonContent}
      `;

      if (docData.trackContent && docData.trackContent[activeTrack]) {
        renderedHTML += docData.trackContent[activeTrack];
      }

      document.getElementById('document-body').innerHTML = renderedHTML;
      console.log("1. Current URL Hash:", window.location.hash);

      if (window.location.hash) {
        setTimeout(() => {
          const targetElement = document.querySelector(window.location.hash);
          console.log("2. Target Element Found:", targetElement);

          if (targetElement) {
            console.log("3. Scrolling now...");
            targetElement.scrollIntoView({ behavior: 'smooth' });
          } else {
            console.warn("⚠️ Hash exists, but NO element with this ID exists in the rendered HTML!");
          }
        }, 150);
      } else {
        console.log("⚠️ No hash found in the URL.");
      }
    });

</html>
